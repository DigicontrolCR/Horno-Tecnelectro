<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Monitor MQTT Broker - Horno Tecnelectro</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="container">
    <!-- Header con logo -->
    <header class="header">
      <div class="logo-container">
        <img src="./images/logo.png" alt="Logo Tecnelectro" class="logo">
      </div>
      <div class="title-container">
        <h1>Servidor para el horno de transformadores</h1>
        <h2>Empresa Tecnelectro</h2>
      </div>
    </header>

    <!-- Panel de logs -->
    <div class="logs-panel">
      <div class="panel-header">
        <h3>📡 Logs en Tiempo Real</h3>
        <button id="clearBtn" class="btn-clear">🔄 Limpiar</button>
      </div>
      <div id="logs" class="logs-content"></div>
    </div>

    <!-- Información del sistema -->
    <div class="info-panel">
      <div class="info-item">
        <span class="label">🟢 Estado:</span>
        <span class="value" id="status">Conectado</span>
      </div>
      <div class="info-item">
        <span class="label">🕐 Última actualización:</span>
        <span class="value" id="lastUpdate">--:--:--</span>
      </div>
      <div class="info-item">
        <span class="label">📊 Mensajes:</span>
        <span class="value" id="messageCount">0</span>
      </div>
    </div>
  </div>

  <script src="./script.js"></script>
</body>
</html>
